<script type="module">
  const SUPABASE_URL = "https://wtqqyadgolqbtoqizfvd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_TnD-uSOe2lD40FXzP52OKQ_7hjfaC0v";

  let supabase = null;
  let roomName = 'CORE-1';
  let subscription = null;

  window.CloudInit = function (cfg, room, onRemote) {
    return new Promise((resolve) => {
      let first = true;
      const done = (ok) => { if (first) { first = false; resolve(ok); } };
      try {
        roomName = room || 'CORE-1';
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        supabase
          .from('star_champions_rooms')
          .select('json')
          .eq('room', roomName)
          .maybeSingle()
          .then(({ data, error }) => {
            if (error) { onRemote(false, null, error.message); done(false); }
            else if (data && data.json) { onRemote(true, data.json, null); done(true); }
            else { onRemote(false, null, null); done(true); }
          });
        if (subscription) supabase.removeChannel(subscription);
        subscription = supabase
          .channel(`room:${roomName}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'star_champions_rooms', filter: `room=eq.${roomName}` },
            (payload) => { if (payload.new && payload.new.json) onRemote(true, payload.new.json, null); })
          .subscribe((status) => { if (status === 'SUBSCRIBED') done(true); });
        setTimeout(() => done(false), 9000);
      } catch (e) { onRemote(false, null, e.message); done(false); }
    });
  };

  window.CloudMutate = async function (fn) {
    if (!supabase) return { result: { error: 'offline' }, st: null };
    const { data, error } = await supabase.from('star_champions_rooms').select('json').eq('room', roomName).maybeSingle();
    if (error || !data) return { result: { error: 'no-class' }, st: null };
    const st = data.json;
    const result = fn(st);
    if (result && result.error) return { result, st: null };
    st.savedAt = Date.now();
    const { error: saveError } = await supabase.from('star_champions_rooms').upsert({ room: roomName, json: st, saved_at: st.savedAt });
    if (saveError) return { result: { error: 'cloud-fail' }, st: null };
    return { result, st };
  };

  window.CloudPublish = async function (payload) {
    if (!supabase) throw new Error('Supabase client not initialized');
    payload.savedAt = Date.now();
    const { error } = await supabase.from('star_champions_rooms').upsert({ room: roomName, json: payload, saved_at: payload.savedAt });
    if (error) throw error;
    return payload;
  };
</script>

/* ===== v5 polish & speed ===== */

/* projector: slides */
#projector.slides { padding:0; overflow:hidden; background:#000; }
.proj.slides-mode { position:absolute; inset:0; }

/* print */

/* ===== PASSWORD SYSTEM (teacher) ===== */
async function hashPw(p) {
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('starchamps:' + p));
      return 'h1:' + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return 'b64:' + btoa(unescape(encodeURIComponent(p)));
}
async function checkPassword(p) {
  const s = state.settings;
  if (s.passHash) return (await hashPw(p)) === s.passHash;
  if (s.passB64) { try { return p === atob(s.passB64); } catch (e) { return false; } }
  return p === 'qwerty';
}

function optimisticMutate(fn) {
  pendingOpt++;
  const run = async () => {
    let res;
    try { res = await window.CloudMutate(fn); } catch (e) { res = { result:{ error:'cloud-fail' } }; }
    pendingOpt--;
    if (res.result && res.result.error) { showToast(explainError(res.result), 'error'); resyncFromCloud(); return res.result; }
    if (res.st && pendingOpt === 0) { applyData(res.st); Store.save(getPayload()); lastSaveTime = Date.now(); scheduleFileWrite(); updateSaveBadge(); softRerender(); }
    return res.result || { ok:true };
  };

}

/* ===================================================================
   TRACK 2 COUNTDOWN (side panel)
   =================================================================== */
const DISMISS = { h:15, m:0 };   // school lets out 3:00 PM
const RETURN  = { h:7,  m:30 };  // first morning back 7:30 AM
// month is 0-indexed
const RAW = [
  { name:'Late Summer Track-Out',  out:[2026,7,21],  back:[2026,8,14] },
  { name:'Thanksgiving Track-Out', out:[2026,10,13], back:[2026,11,7] },
  { name:'Winter Break',           out:[2026,11,18], back:[2027,0,4] },
  { name:'Winter Track-Out',       out:[2027,1,12],  back:[2027,2,8] },
  { name:'Spring Track-Out',       out:[2027,4,7],   back:[2027,5,4] },
  { name:'Summer Break',           out:[2027,5,29],  back:null, last:true },
];
const mkT = (a, t) => new Date(a[0], a[1], a[2], t.h, t.m, 0, 0).getTime();
const EV = RAW.map((e, i) => ({ ...e, i, start:mkT(e.out, DISMISS), end:e.back ? mkT(e.back, RETURN) : Infinity }));
const YEAR_START = new Date(2026, 6, 7, RETURN.h, RETURN.m).getTime();
const cdPad = (n, l = 2) => String(n).padStart(l, '0');
const cdD = (ms, o) => new Date(ms).toLocaleDateString(undefined, o);
const cdT = ms => new Date(ms).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
const SHORT = { weekday:'short', month:'short', day:'numeric' };
function cdSplit(ms) {
  ms = Math.max(0, ms);
  const d = Math.floor(ms / 864e5); ms -= d * 864e5;
  const h = Math.floor(ms / 36e5); ms -= h * 36e5;
  const m = Math.floor(ms / 6e4); ms -= m * 6e4;
  const s = Math.floor(ms / 1e3); ms -= s * 1e3;
  return { d, h, m, s, ms:Math.floor(ms) };
}
let cdStarted = false, cdPhase = null, cdLastSec = -1, cdCollapsed = false;
const cdText = (id, v) => { const el = $(id); if (el && el.textContent !== v) el.textContent = v; };
function cdPref() { try { const v = localStorage.getItem('sc_cd_collapsed'); if (v !== null) return v === '1'; } catch (e) {} return window.innerWidth < 1100; }
function applyCdCollapsed() {
  const p = $('cd-panel'), t = $('cd-toggle'); if (!p) return;
  p.classList.toggle('collapsed', cdCollapsed);

    <div class="cd-kicker" id="cd-kicker">Next track-out in</div>

    <div class="cd-when" id="cd-when"></div>

    <div class="cd-bar"><i id="cd-fill"></i></div>

    <div class="cd-list" id="cd-list">${EV.map(e => `<div class="cd-item" id="ci${e.i}"><div class="cd-n">${e.last ? '★' : e.i + 1}</div><div class="cd-i"><div class="nm">${e.name}</div><div class="dt">${e.last ? 'Last day: ' : ''}${cdD(e.start, SHORT)}${e.back ? ' → ' + cdD(e.end, SHORT) : ''}</div></div><div class="cd-r" id="cr${e.i}"></div></div>`).join('')}</div>

function cdTick() {
  const panel = $('cd-panel'); if (!panel) return;
  const now = Date.now();
  let act = EV.find(e => now < e.end);
  const allDone = !act; if (!act) act = EV[EV.length - 1];
  const inBreak = !allDone && now >= act.start;
  const prev = EV[act.i - 1];
  const phase = allDone ? 'done' : (inBreak ? 'out' : 'in') + act.i;
  if (phase !== cdPhase) {
    if (cdPhase && inBreak) celebrate();
    cdPhase = phase; cdLastSec = -1;
    panel.classList.toggle('out', inBreak || allDone);
    if (allDone) { cdText('cd-kicker', 'Track 2 year complete'); cdText('cd-title', 'Enjoy summer! ☀️'); $('cd-when').textContent = ''; }
    else if (inBreak) { cdText('cd-kicker', '🎉 Tracked out — back to school in'); cdText('cd-title', act.name); $('cd-when').innerHTML = `Back on <b>${cdD(act.end, { weekday:'long', month:'long', day:'numeric' })}</b> at ${cdT(act.end)}`; }
    else { cdText('cd-kicker', act.last ? 'Countdown to summer break' : 'Next track-out in'); cdText('cd-title', act.name); $('cd-when').innerHTML = `<b>${cdD(act.start, { weekday:'long', month:'long', day:'numeric' })}</b> at ${cdT(act.start)}`; }
    cdText('cd-pl', inBreak ? 'Track-out started' : (prev ? 'Back in school' : 'School year started'));
    cdText('cd-pr', inBreak ? 'Back to school' : 'Track-out');
  }
  const target = allDone ? now : (inBreak ? act.end : act.start);
  const p = cdSplit(target - now);
  if (!cdCollapsed && !document.hidden) cdText('cd-ms', cdPad(p.ms, 3));
  const sec = Math.floor(now / 1000); if (sec === cdLastSec) return;   // everything below only changes once a second
  cdLastSec = sec;
  cdText('cd-d', String(p.d)); cdText('cd-h', cdPad(p.h)); cdText('cd-m', cdPad(p.m)); cdText('cd-s', cdPad(p.s));
  const from = inBreak ? act.start : (prev ? prev.end : YEAR_START), to = inBreak ? act.end : act.start;
  const pct = allDone ? 100 : Math.min(Math.max((now - from) / (to - from), 0), 1) * 100;
  $('cd-fill').style.width = pct + '%'; cdText('cd-pc', pct.toFixed(2) + '%');
  const nextEv = EV.find(x => now < x.end);
  EV.forEach(e => {
    const el = $('ci' + e.i), r = $('cr' + e.i); if (!el) return;

    if (now >= e.end) { cls += ' done'; html = e.last ? '🎉' : '✓ Done'; }
    else if (now >= e.start) { cls += ' live'; const q = cdSplit(e.end - now); html = `${q.d}d ${cdPad(q.h)}h<small>Live now</small>`; }
    else { if (e === nextEv && !inBreak) cls += ' next'; const q = cdSplit(e.start - now); html = `${q.d}d ${cdPad(q.h)}h<small>${cls.includes('next') ? 'Up next' : 'Upcoming'}</small>`; }
    if (el.className !== cls) el.className = cls;
    if (r.innerHTML !== html) r.innerHTML = html;
  });
  const mini = allDone ? 'Enjoy summer! ☀️' : `<b>${p.d}d ${cdPad(p.h)}:${cdPad(p.m)}:${cdPad(p.s)}</b> ${inBreak ? 'until back to school' : 'to ' + act.name}`;
  if ($('cd-mini').innerHTML !== mini) $('cd-mini').innerHTML = mini;
  document.title = allDone ? 'Star Champions' : `⭐ Star Champions • ${p.d}d ${cdPad(p.h)}:${cdPad(p.m)}:${cdPad(p.s)}`;
}

.mcx-top h1{font-size:26px;font-weight:700;text-shadow:0 3px 0 #0c120e}
.mcx-bal{padding:8px 14px;border:2px solid #0c120e;border-radius:8px;background:#2a2a2a;color:#ffe27a;font-weight:900;box-shadow:inset 0 -3px 0 #111}
.mcx-grid{display:grid;grid-template-columns:minmax(340px,.9fr) minmax(460px,1.1fr)}
.mcx-left{padding:16px;background:linear-gradient(160deg,#243b2c,#17251d);border-right:3px solid #0c120e;min-width:0}
.mcx-name{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.mcx-name h2{font-size:24px}
.mcx-stage{position:relative;height:clamp(400px,62vh,600px);border-radius:10px;overflow:hidden;border:3px solid #0c120e;background:linear-gradient(#4f9fe6,#8fd0ff 55%,#cdeeff);user-select:none}
.mcx-sky{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.mcx-cloud{position:absolute;left:-140px;width:12px;height:12px;background:#fff;opacity:.9;box-shadow:12px 0 #fff,24px 0 #fff,36px 0 #fff,48px 0 #fff,12px -12px #fff,24px -12px #fff,36px -12px #fff,24px 12px #fff,36px 12px #fff;animation:mcxCloud 80s linear infinite}
.mcx-cloud.c1{top:12%}.mcx-cloud.c2{top:30%;animation-duration:110s;animation-delay:-45s;transform:scale(.7)}.mcx-cloud.c3{top:6%;animation-duration:140s;animation-delay:-90s;transform:scale(1.3);opacity:.7}
@keyframes mcxCloud{to{margin-left:1100px}}
.mcx-host{position:absolute;inset:0}
.mcx-cv{width:100%;height:100%;display:block;touch-action:pan-y;cursor:grab;outline:0}
.mcx-cv:active{cursor:grabbing}
.mcx-fb{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}
.mcx-fb .mc-mini{height:78%;filter:drop-shadow(0 12px 0 #0003)}
.mcx-stage.gl .mcx-fb{display:none}
.mcx-badge{position:absolute;left:10px;top:10px;max-width:calc(100% - 70px);display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:7px 10px;border:2px solid #0c120e;border-radius:8px;background:#ffe27a;color:#2a2108;font-weight:900;font-size:12px;box-shadow:0 3px 0 #7a5d0a}
.mcx-badge button{border:2px solid #0c120e;background:#fff;border-radius:6px;font-weight:900;font-size:11px;cursor:pointer;padding:2px 7px}
.mcx-hint{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:11px;font-weight:800;color:#fff;text-shadow:0 2px 0 #0c120e;pointer-events:none}
.mcx-tools{position:absolute;right:10px;top:10px;display:flex;flex-direction:column;gap:6px}
.mcx-tool{width:40px;height:40px;display:grid;place-items:center;font-size:18px;cursor:pointer;background:#8b8b8b;color:#fff;border:2px solid;border-color:#d6d6d6 #373737 #373737 #d6d6d6;border-radius:4px;box-shadow:0 0 0 2px #0c120e;text-shadow:0 2px 0 #333}
.mcx-tool:hover{background:#7a8fd0}.mcx-tool.on{background:#5d9a46}
.mcx-wear{margin-top:12px;padding-top:12px;border-top:2px solid #a5da7b2b}
.mcx-wear b{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#bfe3a6}
.mcx-chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.mcx-chip{font:800 11px Inter,system-ui;padding:5px 8px;border-radius:5px;background:#36533a;color:#ddf5c1;border:2px solid #0c120e;cursor:default}
.mcx-chip[onclick]{cursor:pointer}.mcx-chip[onclick]:hover{background:#6a3535;color:#ffd5d5}
.mcx-chip.try{background:#ffe27a;color:#2a2108}
.mcx-closet{padding:16px;display:flex;flex-direction:column;background:#1f2b23;min-width:0}
.mcx-closet h2{font-size:28px}
.mcx-tabs{display:flex;gap:5px;margin:14px 0 4px;overflow-x:auto;padding-bottom:6px}
.mcx-tab{flex:1;min-width:66px;display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 4px 6px;background:#3a3a3a;border:2px solid #0c120e;border-bottom-width:5px;color:#cfd8cf;font:800 11px Inter,system-ui;cursor:pointer;border-radius:6px;transition:transform .12s,background .12s}
.mcx-tab i{font-style:normal;font-size:21px;line-height:1.1}.mcx-tab:hover{background:#4c4c4c;transform:translateY(-1px)}
.mcx-tab.on{background:#5d9a46;color:#fff;border-bottom-color:#2f5a22}
.mcx-cathead{display:flex;justify-content:space-between;align-items:center;margin:10px 0 4px}
.mcx-catalog{overflow-y:auto;max-height:540px;padding:6px 4px 6px 0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;align-content:start}
.mcx-slot{display:grid;grid-template-columns:54px minmax(0,1fr);gap:6px 10px;padding:10px;background:#2c3a30;border:2px solid #0c120e;border-radius:8px;position:relative;transition:transform .14s,border-color .14s,background .14s}
.mcx-slot:hover{transform:translateY(-2px);border-color:#8fd36a}
.mcx-slot.own{border-color:#4b7a3f}
.mcx-slot.wear{background:#365a38;border-color:#9be47c}
.mcx-slot.try{border-color:#ffe273;background:#4a4a26;box-shadow:0 0 0 2px #ffe27355,0 0 22px #ffd54a33}
.mcx-ico{width:54px;height:54px;display:grid;place-items:center;font-size:28px;border:2px solid #0c120e;border-radius:6px;background:linear-gradient(145deg,var(--c,#777),#0006),#222;box-shadow:inset 0 2px 0 #fff4}
.mcx-ico span{filter:drop-shadow(0 2px 0 #0007)}
.mcx-meta{min-width:0;display:flex;flex-direction:column;justify-content:center;gap:3px}
.mcx-meta b{font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mcx-price{font-size:11px;font-weight:900;color:#ffe27a}.mcx-price.ok{color:#9be47c}.mcx-price.no{color:#ff9a9a}
.mcx-act{grid-column:1/-1;display:grid;grid-template-columns:1fr 1fr;gap:6px}
.mcx-act .btn{width:100%;padding:6px 4px;font-size:11px;min-height:32px}.mcx-act .btn:only-child{grid-column:1/-1}
.mcx-on{position:absolute;top:-8px;right:8px;background:#9be47c;color:#12301a;border:2px solid #0c120e;border-radius:5px;font-size:9px;font-weight:900;padding:1px 6px;letter-spacing:.06em}
.mcx-bodybox{grid-column:1/-1;display:grid;gap:16px}
.mcx-genders{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mcx-gender{display:flex;flex-direction:column;align-items:center;gap:6px;padding:12px;height:150px;background:#2c3a30;border:3px solid #0c120e;border-radius:8px;color:#fff;font:800 13px Inter,system-ui;cursor:pointer}
.mcx-gender .mc-mini{height:96px}.mcx-gender.on{border-color:#ffe273;background:#4a4a26}
.mcx-tones{display:flex;flex-wrap:wrap;gap:10px}
.mcx-tone{width:44px;height:44px;border:3px solid #0c120e;background:var(--tone);cursor:pointer;border-radius:4px;box-shadow:inset 0 -6px 0 #0003}
.mcx-tone.on{outline:3px solid #ffe273;outline-offset:2px}
.mcx-tip{padding:12px;border-radius:8px;background:#0003;border:2px dashed #7aa86a55;color:#cfe8c0;font-size:12px;line-height:1.5}
@media(max-width:980px){.mcx-grid{grid-template-columns:1fr}.mcx-left{border-right:0;border-bottom:3px solid #0c120e}.mcx-stage{height:clamp(360px,52vh,520px)}.mcx-catalog{max-height:none}}
@media(max-width:560px){.mcx-catalog{grid-template-columns:1fr}.mcx-closet,.mcx-left{padding:12px}.mcx-top h1{font-size:21px}}
@media(prefers-reduced-motion:reduce){.mcx-cloud{animation:none!important}}
