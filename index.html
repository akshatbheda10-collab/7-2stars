<script type="module">
  const SUPABASE_URL = "https://wtqqyadgolqbtoqizfvd.supabase.co";
  const SUPABASE_ANON_KEY = "sb_publishable_TnD-uSOe2lD40FXzP52OKQ_7hjfaC0v";

  let supabase = null;
  let roomName = 'CORE-1';
  let subscription = null;

  window.CloudInit = function (cfg, room, onRemote) {
    return new Promise((resolve) => {
      let first = true;
      const done = (ok) => { if (first) { first = false; resolve(ok); } };
      try {
        roomName = room || 'CORE-1';
        supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        supabase
          .from('star_champions_rooms')
          .select('json')
          .eq('room', roomName)
          .maybeSingle()
          .then(({ data, error }) => {
            if (error) { onRemote(false, null, error.message); done(false); }
            else if (data && data.json) { onRemote(true, data.json, null); done(true); }
            else { onRemote(false, null, null); done(true); }
          });
        if (subscription) supabase.removeChannel(subscription);
        subscription = supabase
          .channel(`room:${roomName}`)
          .on('postgres_changes', { event: '*', schema: 'public', table: 'star_champions_rooms', filter: `room=eq.${roomName}` },
            (payload) => { if (payload.new && payload.new.json) onRemote(true, payload.new.json, null); })
          .subscribe((status) => { if (status === 'SUBSCRIBED') done(true); });
        setTimeout(() => done(false), 9000);
      } catch (e) { onRemote(false, null, e.message); done(false); }
    });
  };

  window.CloudMutate = async function (fn) {
    if (!supabase) return { result: { error: 'offline' }, st: null };
    const { data, error } = await supabase.from('star_champions_rooms').select('json').eq('room', roomName).maybeSingle();
    if (error || !data) return { result: { error: 'no-class' }, st: null };
    const st = data.json;
    const result = fn(st);
    if (result && result.error) return { result, st: null };
    st.savedAt = Date.now();
    const { error: saveError } = await supabase.from('star_champions_rooms').upsert({ room: roomName, json: st, saved_at: st.savedAt });
    if (saveError) return { result: { error: 'cloud-fail' }, st: null };
    return { result, st };
  };

  window.CloudPublish = async function (payload) {
    if (!supabase) throw new Error('Supabase client not initialized');
    payload.savedAt = Date.now();
    const { error } = await supabase.from('star_champions_rooms').upsert({ room: roomName, json: payload, saved_at: payload.savedAt });
    if (error) throw error;
    return payload;
  };
</script>

const slidesCfg = { url:'', auto:false, secs:5, loop:true, alt:false };

function parseSlides(input) {

  const frame = v.match(/src\s*=\s*["']([^"']+)["']/i); if (frame) v = frame[1].replace(/&amp;/g, '&');   // pasted <iframe> embed code works too

}
function slidesSrc() {

/* ===== PASSWORD SYSTEM (teacher) ===== */
async function hashPw(p) {
  try {
    if (window.crypto && crypto.subtle) {
      const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('starchamps:' + p));
      return 'h1:' + Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2, '0')).join('');
    }
  } catch (e) {}
  return 'b64:' + btoa(unescape(encodeURIComponent(p)));
}
async function checkPassword(p) {
  const s = state.settings;
  if (s.passHash) return (await hashPw(p)) === s.passHash;
  if (s.passB64) { try { return p === atob(s.passB64); } catch (e) { return false; } }
  return p === 'qwerty';
}

async function processTokenClaim(raw) {
  if (claiming) return; const sid = ui.activeStudentId;
  if (!activeStudent()) { showToast('Log in first!', 'error'); return; }
  const code = String(raw).trim().toUpperCase().replace(/\s/g, ''); claiming = true;
  const res = await mutate(st => {
    const me = st.students.find(x => x.id === sid); if (!me) return { error:'no-student' };
    if (code !== String(st.currentQrToken).toUpperCase()) return { error:'bad-code' };
    const amt = st.settings.multiplier || 1, before = levelInfo(me.totalEarned).i;
    me.stars += amt; me.totalEarned += amt; st.currentQrToken = newCode();
    addLog(st, '⭐', me.name + ' scanned a code (+' + amt + ')');
    const after = levelInfo(me.totalEarned); if (after.i > before) addLog(st, '🎉', me.name + ' reached ' + after.cur.name + '!');
    return { ok:true, amt, leveled:after.i > before, lv:after.cur, stars:me.stars };
  });
  if (res.error) { claiming = false; if (res.error !== 'offline') { sfx('error'); showToast(explainError(res), 'error'); } return; }
  setTimeout(() => { claiming = false; }, 1200);
  killScanner(); sfx('star'); celebrate(); starPop('+' + res.amt + ' ⭐'); bg.boost = 1;
  showToast('Point claimed! Balance: ' + res.stars + ' stars', 'success');

async function claimPrize(id) {
  const sid = ui.activeStudentId;

    const s = st.students.find(x => x.id === sid), p = st.prizes.find(x => x.id === id); if (!s || !p) return { error:'no-student' };
    if (s.stars < p.cost) return { error:'poor' }; if (p.stock <= 0) return { error:'out' };

  });

  const cloudTxt = Cloud.configured ? (Cloud.on ? 'Connected (' + esc(Cloud.room) + ')' : (Cloud.error ? 'Connection Failure: ' + esc(Cloud.error) : 'Connecting...')) : 'Offline Mode';
  openModal(modalHead('Database & Storage Diagnostics') + `<div class="feed mt12"><span>☁️</span><div><b>Backend:</b> ${cloudTxt}</div></div><div style="display:grid;gap:7px" class="mt12">${row(c.local, 'Browser LocalStorage')}${row(c.idb,'Browser IndexedDB')}</div>${ui.teacher ? '<button class="btn purple block mt16" onclick="closeModal(); setTab(\'setup\')">Open Database Engine</button>' : ''}`);
}
function downloadBackup() {
  try { const blob = new Blob([JSON.stringify(getPayload(), null, 2)], { type:'application/json' }), a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = 'StarChampions_' + window.CORE_ID + '_Backup_' + new Date().toISOString().slice(0, 10) + '.json'; document.body.appendChild(a); a.click(); a.remove(); showToast('Backup file generated', 'success'); }
  catch (e) { showToast('File export failed.', 'info'); }
}
function triggerImportFile() { $('json-import-input').click(); }
function handleImportFile(ev) { const f = ev.target.files[0]; if (!f) return; const r = new FileReader(); r.onload = e => restoreFromText(e.target.result); r.readAsText(f); ev.target.value = ''; }
async function restoreFromText(txt) {
  const o = Store.parse(String(txt || '').trim()); if (!o) { showToast('Invalid JSON file format', 'error'); return; }
  if (Cloud.configured) {
    const res = await mutate(st => { st.students = o.students; st.prizes = o.prizes || st.prizes; st.activity = o.activity || []; st.redemptions = o.redemptions || []; st.settings = Object.assign(st.settings, o.settings || {}); return { ok:true }; });
    if (res.error) { showToast(explainError(res), 'error'); return; }
  } else { applyData(o); saveState(); }
  closeModal(); if (ui.view === 'teacher-dashboard') renderView('teacher-dashboard'); else softRerender(); showToast('Restored ' + state.students.length + ' students', 'success');
}
/* ===== SFX & VISUAL EFFECTS ===== */
let audioCtx = null;
function sfx(type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); const ctx = audioCtx; if (ctx.state === 'suspended') ctx.resume();
    const tone = (f, t0, dur, wave = 'sine', vol = .18) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = wave; o.frequency.setValueAtTime(f, ctx.currentTime + t0); g.gain.setValueAtTime(vol, ctx.currentTime + t0); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t0 + dur); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + dur + .02); };
    if (type === 'star') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .07, .2));
    else if (type === 'pop') tone(520, 0, .06, 'triangle', .1);
    else if (type === 'error') tone(160, 0, .2, 'sawtooth', .15);
    else if (type === 'level') [392, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * .09, .25));
  } catch (e) {}
}
function celebrate() {
  if (typeof confetti !== 'function') { loadLib('confetti').then(ok => { if (ok && typeof confetti === 'function') celebrate(); }); return; }
  const base = { colors: ['#fdcb6e', '#fd79a8', '#6c5ce7', '#00cec9', '#74b9ff'], shapes:['star', 'circle'], scalar: 1.2, zIndex: 140 };
  confetti(Object.assign({}, base, { particleCount:70, angle:60, spread:70, origin:{ x:0, y:.7 } }));
  confetti(Object.assign({}, base, { particleCount:70, angle:120, spread:70, origin:{ x:1, y:.7 } }));
}
function starPop(text) { const d = document.createElement('div'); d.className = 'star-pop'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1400); }
function levelUp(lv) {
  sfx('level'); celebrate(); setTimeout(celebrate, 350); bg.boost = 1.5;
  const d = document.createElement('div'); d.className = 'levelup';
  d.innerHTML = `<div class="big">${lv.icon}</div><div class="disp neon" style="font-size:clamp(44px, 9vw, 84px); font-weight:700;margin-top:14px">LEVEL UP!</div><div class="disp" style="font-size:26px;margin-top:8px">You are now a ${esc(lv.name)}</div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2800);
}
function showToast(msg, type = 'info') {
  const c = $('toast-container'), t = document.createElement('div'); t.className = 'toast';
  t.textContent = msg; t.style.opacity = '0'; t.style.transform = 'translateY(8px)';
  t.style.background = type === 'success' ? '#059669' : type === 'error' ? '#e11d48' : '#4f46e5';
  c.appendChild(t);
  setTimeout(() => { t.style.opacity = '1'; t.style.transform = 'none'; }, 10);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3400);
}

/* ===================================================================
   TRACK 2 COUNTDOWN (side panel)
   =================================================================== */
const DISMISS = { h:15, m:0 };   // school lets out 3:00 PM
const RETURN  = { h:7,  m:30 };  // first morning back 7:30 AM
// month is 0-indexed
const RAW = [
  { name:'Late Summer Track-Out',  out:[2026,7,21],  back:[2026,8,14] },
  { name:'Thanksgiving Track-Out', out:[2026,10,13], back:[2026,11,7] },
  { name:'Winter Break',           out:[2026,11,18], back:[2027,0,4] },
  { name:'Winter Track-Out',       out:[2027,1,12],  back:[2027,2,8] },
  { name:'Spring Track-Out',       out:[2027,4,7],   back:[2027,5,4] },
  { name:'Summer Break',           out:[2027,5,29],  back:null, last:true },
];
const mkT = (a, t) => new Date(a[0], a[1], a[2], t.h, t.m, 0, 0).getTime();
const EV = RAW.map((e, i) => ({ ...e, i, start:mkT(e.out, DISMISS), end:e.back ? mkT(e.back, RETURN) : Infinity }));
const YEAR_START = new Date(2026, 6, 7, RETURN.h, RETURN.m).getTime();
const cdPad = (n, l = 2) => String(n).padStart(l, '0');
const cdD = (ms, o) => new Date(ms).toLocaleDateString(undefined, o);
const cdT = ms => new Date(ms).toLocaleTimeString(undefined, { hour:'numeric', minute:'2-digit' });
const SHORT = { weekday:'short', month:'short', day:'numeric' };
function cdSplit(ms) {
  ms = Math.max(0, ms);
  const d = Math.floor(ms / 864e5); ms -= d * 864e5;
  const h = Math.floor(ms / 36e5); ms -= h * 36e5;
  const m = Math.floor(ms / 6e4); ms -= m * 6e4;
  const s = Math.floor(ms / 1e3); ms -= s * 1e3;
  return { d, h, m, s, ms:Math.floor(ms) };
}
let cdStarted = false, cdPhase = null, cdLastSec = -1, cdCollapsed = false;
const cdText = (id, v) => { const el = $(id); if (el && el.textContent !== v) el.textContent = v; };
function cdPref() { try { const v = localStorage.getItem('sc_cd_collapsed'); if (v !== null) return v === '1'; } catch (e) {} return window.innerWidth < 1100; }
function applyCdCollapsed() {
  const p = $('cd-panel'), t = $('cd-toggle'); if (!p) return;
  p.classList.toggle('collapsed', cdCollapsed);
  t.setAttribute('aria-expanded', String(!cdCollapsed)); t.setAttribute('aria-label', cdCollapsed ? 'Expand countdown' : 'Collapse countdown');
  const sh = document.querySelector('.shell'); if (sh) sh.classList.toggle('cd-collapsed', cdCollapsed);
}
function toggleCd() { cdCollapsed = !cdCollapsed; try { localStorage.setItem('sc_cd_collapsed', cdCollapsed ? '1' : '0'); } catch (e) {} applyCdCollapsed(); }
function startCountdown() {
  if (cdStarted) return; cdStarted = true; cdCollapsed = cdPref();
  $('side').innerHTML = `<div class="cd-panel" id="cd-panel">
    <div class="cd-head"><div class="t"><div class="cd-logo">2</div>Track 2 Countdown</div><div class="flex ac gap8"><span class="cd-tag hide-xs">7th Grade</span><button class="cd-toggle" id="cd-toggle" onclick="toggleCd()" aria-expanded="true" aria-label="Collapse countdown">${ic('chev', 14)}</button></div></div>
    <div class="cd-mini" id="cd-mini"></div>
    <div class="cd-body">
    <div class="cd-kicker" id="cd-kicker">Next track-out in</div>
    <div class="cd-title" id="cd-title">—</div>
    <div class="cd-when" id="cd-when"></div>
    <div class="cd-tiles">
      <div><b id="cd-d">0</b><small>Days</small></div><div><b id="cd-h">00</b><small>Hours</small></div>
      <div><b id="cd-m">00</b><small>Min</small></div><div><b id="cd-s">00</b><small>Sec</small></div>
    </div>
    <div class="cd-ms"><span id="cd-ms">000</span> ms</div>
    <div class="cd-bar"><i id="cd-fill"></i></div>
    <div class="cd-prow"><span id="cd-pl"></span><span class="pct" id="cd-pc">0%</span><span id="cd-pr"></span></div>
    <div class="cd-list" id="cd-list">${EV.map(e => `<div class="cd-item" id="ci${e.i}"><div class="cd-n">${e.last ? '★' : e.i + 1}</div><div class="cd-i"><div class="nm">${e.name}</div><div class="dt">${e.last ? 'Last day: ' : ''}${cdD(e.start, SHORT)}${e.back ? ' → ' + cdD(e.end, SHORT) : ''}</div></div><div class="cd-r" id="cr${e.i}"></div></div>`).join('')}</div>
    <div class="cd-foot">Dates follow the WCPSS 26-27 Year-Round Multi-Track Calendar (Track 2). Countdowns end at ${cdT(EV[0].start)} dismissal; "back to school" uses ${cdT(EV[0].end)}. Weather make-up days can change the calendar — confirm at wcpss.net/calendars.</div>
    </div>
  </div>`;
  applyCdCollapsed(); cdTick(); setInterval(cdTick, 100);
}
function cdTick() {
  const panel = $('cd-panel'); if (!panel) return;
  const now = Date.now();
  let act = EV.find(e => now < e.end);
  const allDone = !act; if (!act) act = EV[EV.length - 1];
  const inBreak = !allDone && now >= act.start;
  const prev = EV[act.i - 1];
  const phase = allDone ? 'done' : (inBreak ? 'out' : 'in') + act.i;
  if (phase !== cdPhase) {
    if (cdPhase && inBreak) celebrate();
    cdPhase = phase; cdLastSec = -1;
    panel.classList.toggle('out', inBreak || allDone);
    if (allDone) { cdText('cd-kicker', 'Track 2 year complete'); cdText('cd-title', 'Enjoy summer! ☀️'); $('cd-when').textContent = ''; }
    else if (inBreak) { cdText('cd-kicker', '🎉 Tracked out — back to school in'); cdText('cd-title', act.name); $('cd-when').innerHTML = `Back on <b>${cdD(act.end, { weekday:'long', month:'long', day:'numeric' })}</b> at ${cdT(act.end)}`; }
    else { cdText('cd-kicker', act.last ? 'Countdown to summer break' : 'Next track-out in'); cdText('cd-title', act.name); $('cd-when').innerHTML = `<b>${cdD(act.start, { weekday:'long', month:'long', day:'numeric' })}</b> at ${cdT(act.start)}`; }
    cdText('cd-pl', inBreak ? 'Track-out started' : (prev ? 'Back in school' : 'School year started'));
    cdText('cd-pr', inBreak ? 'Back to school' : 'Track-out');
  }
  const target = allDone ? now : (inBreak ? act.end : act.start);
  const p = cdSplit(target - now);
  if (!cdCollapsed && !document.hidden) cdText('cd-ms', cdPad(p.ms, 3));
  const sec = Math.floor(now / 1000); if (sec === cdLastSec) return;   // everything below only changes once a second
  cdLastSec = sec;
  cdText('cd-d', String(p.d)); cdText('cd-h', cdPad(p.h)); cdText('cd-m', cdPad(p.m)); cdText('cd-s', cdPad(p.s));
  const from = inBreak ? act.start : (prev ? prev.end : YEAR_START), to = inBreak ? act.end : act.start;
  const pct = allDone ? 100 : Math.min(Math.max((now - from) / (to - from), 0), 1) * 100;
  $('cd-fill').style.width = pct + '%'; cdText('cd-pc', pct.toFixed(2) + '%');
  const nextEv = EV.find(x => now < x.end);
  EV.forEach(e => {
    const el = $('ci' + e.i), r = $('cr' + e.i); if (!el) return;
    let cls = 'cd-item', html;
    if (now >= e.end) { cls += ' done'; html = e.last ? '🎉' : '✓ Done'; }
    else if (now >= e.start) { cls += ' live'; const q = cdSplit(e.end - now); html = `${q.d}d ${cdPad(q.h)}h<small>Live now</small>`; }
    else { if (e === nextEv && !inBreak) cls += ' next'; const q = cdSplit(e.start - now); html = `${q.d}d ${cdPad(q.h)}h<small>${cls.includes('next') ? 'Up next' : 'Upcoming'}</small>`; }
    if (el.className !== cls) el.className = cls;
    if (r.innerHTML !== html) r.innerHTML = html;
  });
  const mini = allDone ? 'Enjoy summer! ☀️' : `<b>${p.d}d ${cdPad(p.h)}:${cdPad(p.m)}:${cdPad(p.s)}</b> ${inBreak ? 'until back to school' : 'to ' + act.name}`;
  if ($('cd-mini').innerHTML !== mini) $('cd-mini').innerHTML = mini;
  document.title = allDone ? 'Star Champions' : `⭐ Star Champions • ${p.d}d ${cdPad(p.h)}:${cdPad(p.m)}:${cdPad(p.s)}`;
}

/* ===== START ===== */
initGate();
</script>
