<!-- Cloud engine (only used if you paste a Firebase config at the top of the main script) -->
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
import { getFirestore, doc, onSnapshot, runTransaction, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
let db = null, ref = null;
window.CloudInit = function (cfg, room, onRemote) {
  return new Promise(resolve => {
    let first = true;
    const done = ok => { if (first) { first = false; resolve(ok); } };
    try {
      const app = initializeApp(cfg, 'star-champions');
      db = getFirestore(app);
      ref = doc(db, 'starChampionsRooms', room);
      onSnapshot(ref, snap => {
        let data = null;
        try { if (snap.exists()) data = JSON.parse(snap.data().json); } catch (e) {}
        onRemote(snap.exists(), data, null); done(true);
      }, err => { onRemote(false, null, err.message); done(false); });
      setTimeout(() => done(false), 9000);
    } catch (e) { onRemote(false, null, e.message); done(false); }
  });
};
window.CloudMutate = async function (fn) {
  return await runTransaction(db, async tx => {
    const snap = await tx.get(ref);
    if (!snap.exists()) return { result: { error: 'no-class' }, st: null };
    const st = JSON.parse(snap.data().json);
    const result = fn(st);
    if (result && result.error) return { result, st: null };
    st.savedAt = Date.now();
    tx.set(ref, { json: JSON.stringify(st), savedAt: st.savedAt });
    return { result, st };
  });
};
window.CloudPublish = async function (payload) {
  payload.savedAt = Date.now();
  await setDoc(ref, { json: JSON.stringify(payload), savedAt: payload.savedAt });
  return payload;
};
</script>

<script>
/* ============================================================
   TEACHER SETUP  (read me!)
   To make students' stars land on YOUR class (any device), paste
   your free Firebase web config in place of null below, e.g.
     const FIREBASE_CONFIG = { apiKey:"...", authDomain:"...", projectId:"...", appId:"..." };
   The Teacher Hub → "Save & Connect" button explains the 5 steps.
   ============================================================ */
const FIREBASE_CONFIG = null;
const CLASS_ROOM = 'CLASS-1';

/* ===== STORAGE: localStorage + IndexedDB + tab memory ===== */
const Store = (() => {
  const KEY = 'StarCentral_V4', LEGACY = 'ClassroomStarRewards_V3', DBN = 'StarCentralDB', TAG = 'SC4::';
  const caps = { local:false, idb:false, tab:false };
  let db = null;
  const parse = s => { try { const o = JSON.parse(s); return (o && Array.isArray(o.students)) ? o : null; } catch (e) { return null; } };
  function openDB() { return new Promise(res => { try { const r = indexedDB.open(DBN, 1); r.onupgradeneeded = () => r.result.createObjectStore('kv'); r.onsuccess = () => res(r.result); r.onerror = () => res(null); r.onblocked = () => res(null); } catch (e) { res(null); } }); }
  function rawGet(k) { return new Promise(res => { if (!db) return res(null); try { const q = db.transaction('kv').objectStore('kv').get(k); q.onsuccess = () => res(q.result || null); q.onerror = () => res(null); } catch (e) { res(null); } }); }
  function rawPut(k, v) { return new Promise(res => { if (!db) return res(false); try { const t = db.transaction('kv', 'readwrite'); t.objectStore('kv').put(v, k); t.oncomplete = () => res(true); t.onerror = () => res(false); } catch (e) { res(false); } }); }
  async function init() {
    try { localStorage.setItem('__sc_t', '1'); localStorage.removeItem('__sc_t'); caps.local = true; } catch (e) {}
    try { db = await openDB(); caps.idb = !!db; } catch (e) {}
    try { window.name = window.name; caps.tab = true; } catch (e) {}
  }
  async function load() {
    const c = [];
    if (caps.local) { try { const s = localStorage.getItem(KEY); if (s) c.push(parse(s)); } catch (e) {} }
    if (caps.idb) { const s = await rawGet(KEY); if (s) c.push(parse(s)); }
    try { if (typeof window.name === 'string' && window.name.startsWith(TAG)) c.push(parse(window.name.slice(TAG.length))); } catch (e) {}
    let best = c.filter(Boolean).sort((a, b) => (b.savedAt || 0) - (a.savedAt || 0))[0] || null;
    if (!best && caps.local) { try { const old = parse(localStorage.getItem(LEGACY)); if (old) best = old; } catch (e) {} }
    return best;
  }
  function save(obj) {
    const str = JSON.stringify(obj);
    if (caps.local) { try { localStorage.setItem(KEY, str); } catch (e) { caps.local = false; } }
    if (caps.idb && db) rawPut(KEY, str);
    try { window.name = TAG + str; } catch (e) {}
  }
  return { init, load, save, caps, KEY, parse, rawGet, rawPut };
})();

/* ===== mutate(): every change goes through here.
   Cloud mode: atomic transaction on the shared class. Local mode: edits this device and saves. ===== */
async function mutate(fn) {
  if (Cloud.on && window.CloudMutate) {
    try {
      const r = await window.CloudMutate(fn);
      if (r.result && r.result.error) return r.result;
      if (r.st) { applyData(r.st); Store.save(getPayload()); lastSaveTime = Date.now(); scheduleFileWrite(); updateSaveBadge(); }
      return r.result || { ok:true };
    } catch (e) { console.error(e); showToast('Cloud save failed. Check the internet and try again.', 'error'); return { error:'cloud-fail' }; }
  }
  const res = fn(state);
  if (res && res.error) return res;
  saveState();
  return res || { ok:true };
}
function explainError(res) {
  const m = { 'no-class':'Your teacher has not started the cloud class yet.', 'bad-code':'That code is not valid or already used. Scan the one on screen!', 'no-student':'Could not find your account.' };
  return m[res.error] || 'Something went wrong. Try again.';
}

/* ===== save a copy to a file on the teacher's computer (Chrome / Edge) ===== */
async function fileInit() {
  if (!FileSave.supported) return;
  const h = await Store.rawGet('fileHandle'); if (!h) return;
  FileSave.handle = h;
  try { FileSave.status = (await h.queryPermission({ mode:'readwrite' })) === 'granted' ? 'on' : 'needs-permission'; } catch (e) { FileSave.status = 'needs-permission'; }
}
async function fileLink() {
  if (!FileSave.supported) { showToast('This browser cannot do this. Use Chrome or Edge on a computer, or use Backup.', 'info'); return; }
  try {
    const h = await window.showSaveFilePicker({ suggestedName:'StarChampions-data.json', types:[{ description:'Star Champions data', accept:{ 'application/json':['.json'] } }] });
    FileSave.handle = h; FileSave.status = 'on'; await Store.rawPut('fileHandle', h); await fileWrite();
    showToast('Linked! Every change now saves to that file.', 'success'); updateSaveBadge(); refreshSaveCenter();
  } catch (e) { if (e && e.name !== 'AbortError') showToast('This editor blocks file saving (' + (e.name || 'error') + '). Use Backup instead.', 'info'); }
}
async function fileWrite() {
  if (!FileSave.handle || FileSave.status !== 'on') return;
  try { const w = await FileSave.handle.createWritable(); await w.write(JSON.stringify(getPayload(), null, 2)); await w.close(); FileSave.last = Date.now(); }
  catch (e) { FileSave.status = 'needs-permission'; updateSaveBadge(); refreshSaveCenter(); }
}
function scheduleFileWrite() { if (!FileSave.handle) return; clearTimeout(FileSave.timer); FileSave.timer = setTimeout(fileWrite, 700); }
async function fileReconnect() {
  try { const p = await FileSave.handle.requestPermission({ mode:'readwrite' }); if (p === 'granted') { FileSave.status = 'on'; await fileWrite(); showToast('Reconnected to your save file', 'success'); } }
  catch (e) { showToast('Could not reconnect. Link the file again.', 'error'); }
  updateSaveBadge(); refreshSaveCenter();
}

function updateSaveBadge() {
  const t = $('save-text'), d = $('save-dot'); if (!t) return;
  let txt, cls = '';
  if (Cloud.on) txt = 'Live cloud';
  else if (Cloud.configured) { txt = 'Cloud offline'; cls = 'bad'; }
  else if (Store.caps.local || Store.caps.idb) txt = lastSaveTime ? 'Saved ' + clock(lastSaveTime) : 'Ready';
  else { txt = 'Reload-only save'; cls = 'warn'; }
  if (FileSave.handle && FileSave.status === 'on') txt += ' + file';
  t.textContent = txt; d.className = 'dot ' + cls;
}
function persistSession() { try { sessionStorage.setItem('sc_ui', JSON.stringify({ view:ui.view, teacher:ui.teacher, activeStudentId:ui.activeStudentId })); } catch (e) {} }
function restoreSession() {
  try {
    const o = JSON.parse(sessionStorage.getItem('sc_ui') || 'null'); if (!o) return;
    ui.teacher = !!o.teacher;
    if (o.activeStudentId && state.students.some(s => s.id === o.activeStudentId)) ui.activeStudentId = o.activeStudentId;

/* ===== 3D background ===== */
const bg = { boost:0, mx:0, my:0 };
function initBackground() {
  if (typeof THREE === 'undefined') return;
  try {
    const reduced = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    const renderer = new THREE.WebGLRenderer({ canvas:$('bg3d'), alpha:true, antialias:true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 1.75));
    const scene = new THREE.Scene(), camera = new THREE.PerspectiveCamera(60, 1, .1, 100); camera.position.z = 8;
    scene.add(new THREE.AmbientLight(0xffffff, .6));
    const dl = new THREE.DirectionalLight(0xffffff, .9); dl.position.set(4, 6, 8); scene.add(dl);
    const p1 = new THREE.PointLight(0xfd79a8, 1.3, 40); p1.position.set(-8, 4, 2); scene.add(p1);
    const p2 = new THREE.PointLight(0x6c5ce7, 1.5, 40); p2.position.set(8, -4, 2); scene.add(p2);
    const shape = new THREE.Shape();
    for (let i = 0; i < 10; i++) { const r = i % 2 ? .42 : 1, a = i * Math.PI / 5 + Math.PI / 2, x = Math.cos(a) * r, y = Math.sin(a) * r; if (i) shape.lineTo(x, y); else shape.moveTo(x, y); }
    shape.closePath();
    const starGeo = new THREE.ExtrudeGeometry(shape, { depth:.35, bevelEnabled:true, bevelThickness:.1, bevelSize:.08, bevelSegments:3 }); starGeo.center();
    const geos = [starGeo, new THREE.TorusGeometry(.6, .22, 12, 28), new THREE.OctahedronGeometry(.7), new THREE.IcosahedronGeometry(.6)];
    const colors = [0xfdcb6e, 0xfd79a8, 0x6c5ce7, 0x00cec9, 0x74b9ff, 0xff7675], meshes = [], count = reduced ? 14 : 30;
    for (let i = 0; i < count; i++) {
      const g = i % 2 === 0 ? geos[0] : geos[1 + (i % 3)], col = colors[i % colors.length];
      const m = new THREE.Mesh(g, new THREE.MeshStandardMaterial({ color:col, metalness:.35, roughness:.3, emissive:col, emissiveIntensity:.18 }));
      m.position.set((Math.random() - .5) * 26, (Math.random() - .5) * 16, -Math.random() * 12 - 1);
      m.scale.setScalar(.5 + Math.random() * .9); m.rotation.set(Math.random() * 6, Math.random() * 6, 0);
      m.userData = { rx:(Math.random() - .5) * .02, ry:(Math.random() - .5) * .03, fy:Math.random() * 6, sp:.3 + Math.random() * .6, baseY:m.position.y };
      scene.add(m); meshes.push(m);
    }
    const n = reduced ? 150 : 420, arr = new Float32Array(n * 3);
    for (let i = 0; i < n * 3; i += 3) { arr[i] = (Math.random() - .5) * 40; arr[i + 1] = (Math.random() - .5) * 24; arr[i + 2] = -Math.random() * 18; }
    const pg = new THREE.BufferGeometry(); pg.setAttribute('position', new THREE.BufferAttribute(arr, 3));
    const pts = new THREE.Points(pg, new THREE.PointsMaterial({ color:0xffffff, size:.045, transparent:true, opacity:.7 })); scene.add(pts);
    function resize() { renderer.setSize(window.innerWidth, window.innerHeight, false); camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix(); }
    resize(); window.addEventListener('resize', resize);
    let t = 0;
    (function loop() {
      requestAnimationFrame(loop); if (document.hidden) return;
      t += .016; bg.boost *= .95; const k = 1 + bg.boost * 7;
      meshes.forEach(m => { const u = m.userData; m.rotation.x += u.rx * k; m.rotation.y += (u.ry + .004) * k; m.position.y = u.baseY + Math.sin(t * u.sp + u.fy) * .6; });
      pts.rotation.y += .0005;
      camera.position.x += (bg.mx * 1.3 - camera.position.x) * .03; camera.position.y += (bg.my * .9 - camera.position.y) * .03; camera.lookAt(0, 0, 0);
      renderer.render(scene, camera);
    })();
  } catch (e) { console.warn('3D background unavailable', e); }
}
let lastTilt = null;
function bindFx() {
  document.addEventListener('pointermove', e => {
    bg.mx = (e.clientX / window.innerWidth - .5) * 2; bg.my = -(e.clientY / window.innerHeight - .5) * 2;
    const root = document.documentElement.style; root.setProperty('--tx', (bg.mx * 14).toFixed(1)); root.setProperty('--ty', (bg.my * 5).toFixed(1));
    const el = e.target.closest ? e.target.closest('.tilt') : null;
    if (lastTilt && lastTilt !== el) lastTilt.style.transform = '';
    if (!el) { lastTilt = null; return; }
    const r = el.getBoundingClientRect(), px = (e.clientX - r.left) / r.width, py = (e.clientY - r.top) / r.height, max = +el.dataset.tilt || 10;
    el.style.transform = `perspective(900px) rotateX(${((.5 - py) * max).toFixed(2)}deg) rotateY(${((px - .5) * max).toFixed(2)}deg) scale(1.025)`;
    el.style.setProperty('--mx', (px * 100) + '%'); el.style.setProperty('--my', (py * 100) + '%'); lastTilt = el;
  });
  document.addEventListener('mouseleave', () => { if (lastTilt) lastTilt.style.transform = ''; lastTilt = null; });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && ui.projector) closeProjector(); });
}

function showFatal(msg) {
  let f = $('fatal'); if (!f) { f = document.createElement('div'); f.id = 'fatal'; document.body.appendChild(f); }
  f.innerHTML = `<div class="notice bad"><b>Something broke:</b> ${esc(msg)}<br><span class="tiny">Take a screenshot of this and send it to get it fixed.</span></div>`;
}
window.addEventListener('error', e => showFatal(e.message || 'Unknown error'));
window.addEventListener('unhandledrejection', e => showFatal((e.reason && e.reason.message) || String(e.reason)));

async function boot() {
  document.querySelectorAll('[data-ic]').forEach(e => { e.innerHTML = ic(e.dataset.ic, 16); });
  await Store.init();
  const saved = await Store.load();
  if (saved) applyData(saved);
  if (!state.currentQrToken) state.currentQrToken = newCode();
  await fileInit();
  restoreSession(); initBackground(); bindFx();
  updateNav(); renderView(ui.view);
  if (!saved) saveState(); else { lastSaveTime = state.savedAt || Date.now(); updateSaveBadge(); }
  if (Cloud.configured) connectCloud();
  window.addEventListener('storage', e => {
    if (e.key !== Store.KEY || !e.newValue || Cloud.on) return;
    const o = Store.parse(e.newValue);
    if (o && (o.savedAt || 0) > state.savedAt) { applyData(o); updateSaveBadge(); softRerender(); }
  });
}
window.addEventListener('DOMContentLoaded', boot);

async function connectCloud() {
  if (!window.CloudInit) { Cloud.error = 'Cloud engine blocked on this network'; updateSaveBadge(); return; }
  const ok = await window.CloudInit(FIREBASE_CONFIG, CLASS_ROOM, (exists, data, err) => {
    Cloud.on = !err; Cloud.exists = exists; Cloud.error = err || null;
    if (exists && data && data.savedAt !== state.savedAt) { applyData(data); Store.save(getPayload()); lastSaveTime = Date.now(); scheduleFileWrite(); softRerender(); }
    updateSaveBadge(); refreshSaveCenter();
  });
  if (!ok) { Cloud.on = false; updateSaveBadge(); }
}
async function publishToCloud() {
  if (!window.CloudPublish || !Cloud.on) { showToast('Cloud is not connected.', 'error'); return; }
  try { await window.CloudPublish(getPayload()); showToast('Your class is now live in the cloud!', 'success'); } catch (e) { showToast('Could not publish: ' + e.message, 'error'); }
}

function renderView(name) {

function postRender() {
  document.querySelectorAll('[data-ic]').forEach(e => { if (!e.innerHTML) e.innerHTML = ic(e.dataset.ic, +e.dataset.s || 16); });
  document.querySelectorAll('[data-count]').forEach(el => {
    const to = +el.dataset.count || 0, t0 = performance.now();
    (function step(t) { const p = Math.min(1, (t - t0) / 800); el.textContent = Math.round(to * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); })(t0);
  });
  requestAnimationFrame(() => requestAnimationFrame(() => document.querySelectorAll('[data-w]').forEach(el => { el.style.width = el.dataset.w + '%'; })));
}

function coinHTML() {
  let l = '';
  for (let i = -6; i <= 6; i++) { const edge = Math.abs(i) < 6; l += `<i style="transform:translateZ(${i}px)${i === -6 ? ' rotateY(180deg)' : ''};${edge ? 'filter:brightness(.62)' : ''}">${edge ? '' : '★'}</i>`; }
  return `<div class="coin-wrap"><div class="coin">${l}</div></div>`;
}
function podiumHTML(top3) {
  const cfg = [{ i:1, cls:'p2', h:150, label:'2nd' }, { i:0, cls:'p1', h:195, label:'1st' }, { i:2, cls:'p3', h:120, label:'3rd' }];
  const cols = cfg.map(c => {
    const s = top3[c.i]; let slices = '';
    for (let k = 0; k < 9; k++) slices += `<div class="slice" style="transform:translateZ(${-(k + 1) * 4}px);filter:brightness(${(1 - k * .06).toFixed(2)})"></div>`;
    return `<div class="pod-col ${c.cls}">${s ? `<div class="pod-person">${c.cls === 'p1' ? '<div style="font-size:26px">👑</div>' : ''}<div class="pod-avatar">${s.avatar}</div><div class="b small trunc mt8">${esc(s.name)}</div><div class="gold b small">⭐ ${s.totalEarned}</div></div>` : ''}
      <div class="pod ${c.cls}" style="height:${c.h}px">${slices}<div class="pod-face">${c.label}</div></div></div>`;
  }).join('');
  return `<div class="stage-wrap"><div class="beam"></div><div class="floor"></div><div class="stage3d">${cols}</div></div>`;
}

  else { sfx('error'); showToast('Name or PIN is not right. Try again!', 'error'); }
}
async function processTokenClaim(raw) {
  if (claiming) return; const sid = ui.activeStudentId;
  if (!activeStudent()) { showToast('Log in first!', 'error'); return; }
  const code = String(raw).trim().toUpperCase().replace(/\s/g, ''); claiming = true;
  const res = await mutate(st => {
    const me = st.students.find(x => x.id === sid); if (!me) return { error:'no-student' };
    if (code !== String(st.currentQrToken).toUpperCase()) return { error:'bad-code' };
    const amt = st.settings.multiplier || 1, before = levelInfo(me.totalEarned).i;
    me.stars += amt; me.totalEarned += amt; st.currentQrToken = newCode();
    addLog(st, '⭐', me.name + ' scanned a code (+' + amt + ')');
    const after = levelInfo(me.totalEarned); if (after.i > before) addLog(st, '🚀', me.name + ' reached ' + after.cur.name + '!');
    return { ok:true, amt, leveled:after.i > before, lv:after.cur, stars:me.stars };
  });
  if (res.error) { claiming = false; sfx('error'); showToast(explainError(res), 'error'); return; }
  setTimeout(() => { claiming = false; }, 1200);
  killScanner(); sfx('star'); celebrate(); starPop('+' + res.amt + ' ⭐'); bg.boost = 1;
  showToast('Point claimed! You have ' + res.stars + ' stars', 'success'); switchView('student-dashboard');
  if (res.leveled) setTimeout(() => levelUp(res.lv), 900);
}
async function claimPrize(id) {
  const sid = ui.activeStudentId;
  const res = await mutate(st => {
    const s = st.students.find(x => x.id === sid), p = st.prizes.find(x => x.id === id); if (!s || !p) return { error:'no-student' };
    if (s.stars < p.cost) return { error:'poor' }; if (p.stock <= 0) return { error:'out' };
    s.stars -= p.cost; p.stock -= 1;
    st.redemptions.unshift({ id:'rd-' + Date.now() + '-' + Math.random().toString(36).slice(2, 5), studentId:s.id, name:s.name, title:p.title, icon:p.icon, cost:p.cost, t:Date.now(), done:false });
    addLog(st, '🎁', s.name + ' claimed ' + p.title); return { ok:true, title:p.title };
  });
  if (res.error) { sfx('error'); showToast(res.error === 'poor' ? 'Not enough stars!' : res.error === 'out' ? 'Out of stock!' : explainError(res), 'error'); renderView('student-shop'); return; }
  sfx('star'); celebrate(); bg.boost = .8; showToast('Claimed "' + res.title + '"! Show your teacher.', 'success'); renderView('student-shop');
}

async function teacherAdjustStars(id, amt) {
  await mutate(st => {
    const s = st.students.find(x => x.id === id); if (!s) return { error:'no-student' };
    const before = levelInfo(s.totalEarned).i;
    if (amt > 0) { s.stars += amt; s.totalEarned += amt; } else { s.stars = Math.max(0, s.stars + amt); s.totalEarned = Math.max(0, s.totalEarned + amt); }
    if (amt > 0) { addLog(st, '⭐', s.name + ' earned +' + amt + ' from the teacher'); const a = levelInfo(s.totalEarned); if (a.i > before) addLog(st, '🚀', s.name + ' reached ' + a.cur.name + '!'); }
    return { ok:true };
  });
  if (amt > 0) bg.boost = .6; sfx(amt > 0 ? 'star' : 'pop'); refreshTeacherLists();
}

}

/* ===== effects ===== */
let audioCtx = null;
function sfx(type) {
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); const ctx = audioCtx; if (ctx.state === 'suspended') ctx.resume();
    const tone = (f, t0, dur, wave = 'sine', vol = .18) => { const o = ctx.createOscillator(), g = ctx.createGain(); o.type = wave; o.frequency.setValueAtTime(f, ctx.currentTime + t0); g.gain.setValueAtTime(vol, ctx.currentTime + t0); g.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + t0 + dur); o.connect(g); g.connect(ctx.destination); o.start(ctx.currentTime + t0); o.stop(ctx.currentTime + t0 + dur + .02); };
    if (type === 'star') [523.25, 659.25, 783.99, 1046.5].forEach((f, i) => tone(f, i * .07, .2));
    else if (type === 'pop') tone(520, 0, .07, 'triangle', .12);
    else if (type === 'error') tone(160, 0, .2, 'sawtooth', .15);
    else if (type === 'level') [392, 523.25, 659.25, 783.99, 1046.5, 1318.5].forEach((f, i) => tone(f, i * .09, .25));
  } catch (e) {}
}
function celebrate() {
  if (typeof confetti !== 'function') return;
  const base = { colors:['#fdcb6e', '#fd79a8', '#6c5ce7', '#00cec9', '#74b9ff'], shapes:['star', 'circle'], scalar:1.2, zIndex:140 };
  confetti(Object.assign({}, base, { particleCount:70, angle:60, spread:70, origin:{ x:0, y:.7 } }));
  confetti(Object.assign({}, base, { particleCount:70, angle:120, spread:70, origin:{ x:1, y:.7 } }));
}
function starPop(text) { const d = document.createElement('div'); d.className = 'star-pop'; d.textContent = text; document.body.appendChild(d); setTimeout(() => d.remove(), 1400); }
function levelUp(lv) {
  sfx('level'); celebrate(); setTimeout(celebrate, 350); bg.boost = 1.5;
  const d = document.createElement('div'); d.className = 'levelup';
  d.innerHTML = `<div class="big">${lv.icon}</div><div class="disp neon" style="font-size:clamp(44px,9vw,84px);font-weight:700;margin-top:14px">LEVEL UP!</div><div class="disp" style="font-size:26px;margin-top:8px">You are now a ${esc(lv.name)}</div>`;
  document.body.appendChild(d); setTimeout(() => d.remove(), 2800);
}
function showToast(msg, type = 'info') {
  const c = $('toast-container'), t = document.createElement('div'); t.className = 'toast'; t.textContent = msg; t.style.opacity = '0'; t.style.transform = 'translateY(8px)';
  t.style.background = type === 'success' ? '#059669' : type === 'error' ? '#e11d48' : '#4f46e5'; c.appendChild(t);
  setTimeout(() => { t.style.opacity = '1'; t.style.transform = 'none'; }, 10);
  setTimeout(() => { t.style.opacity = '0'; setTimeout(() => t.remove(), 300); }, 3400);
}
</script>
